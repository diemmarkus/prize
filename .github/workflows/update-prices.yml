name: Update prices

on:
  # Paused: Geizhals answers GitHub's servers with HTTP 403 (see data/probe.json), and we don't
  # work around a block. Run by hand from the Actions tab if that ever changes.
  workflow_dispatch: # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parser test
        run: node tests/parse.test.mjs

      - name: Probe (one test page, once a day and after code changes)
        run: node scripts/update-prices.mjs --probe

      - name: Geizhals prices
        run: node scripts/update-prices.mjs

      - name: Commit if changed
        run: |
          git config user.name "prize-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prices"
            git pull --rebase --quiet -X theirs
            git push
          fi
