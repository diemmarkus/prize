name: Update prices

on:
  schedule:
    - cron: "23 4 * * *" # every day at 05:23 Vienna (winter time); times are UTC
  workflow_dispatch: # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node tests/parse.test.mjs

      - name: Prices (Keepa, Travelpayouts)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node scripts/update-prices.mjs

      - name: Commit if changed
        run: |
          git config user.name "prize-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prices"
            git pull --rebase --quiet -X theirs
            git push
          fi
